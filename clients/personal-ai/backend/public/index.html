<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>思意工作台 · Siyi Workbench</title>
  <!-- 核心样式 -->
  <link rel="stylesheet" href="/core/main.css">
  <link rel="stylesheet" href="/core/overrides.css">
  <link rel="stylesheet" href="/core/motion.css">
  <!-- 模块样式 -->
  <link rel="stylesheet" href="/modules/search/style.css">
  <link rel="stylesheet" href="/modules/prompt/style.css">
  <link rel="stylesheet" href="/modules/website/style.css">
  <link rel="stylesheet" href="/modules/obsidian-reviews/style.css">
  <link rel="stylesheet" href="/modules/radar/style.css">
  <link rel="stylesheet" href="/modules/english/style.css">
  <link rel="stylesheet" href="/modules/personal-ai/style.css">
</head>
<body>
  <a class="skip-link" href="#contentArea" id="skipLink">跳到主要内容</a>
  <div id="app">
    <!-- ===== Header (56px) ===== -->
    <header class="app-header" id="appHeader">
      <div class="app-header-left">
        <div class="sidebar-brand">
          <div class="sidebar-brand-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2l2.5 5 5.5.8-4 3.9.9 5.5L12 14.8 7.1 17.2 8 11.7 4 7.8l5.5-.8L12 2z"/>
            </svg>
          </div>
          <span class="sidebar-brand-text">思意工作台</span>
        </div>
        <div class="header-left">
        <button class="header-icon-btn sidebar-toggle-btn" id="sidebarToggleBtn" title="打开菜单" aria-label="打开菜单">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
        <h1 class="header-title" id="pageTitle">知识</h1>
        <p class="header-desc" id="pageDesc">搜索和浏览你的个人知识库</p>
        </div>
      </div>
      <div class="header-right">
        <div class="header-search" id="headerSearch">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" class="header-search-input" id="headerSearchInput" placeholder="搜索知识..." />
          <span class="header-search-kbd">⌘K</span>
        </div>
        <button class="header-icon-btn" id="themeToggle" title="切换主题">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
        <button class="header-icon-btn" id="aiToggleBtn" title="Personal AI">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3l1.9 5.8L20 10l-5.1 2.5L13 18l-2-5.5L6 10l5.1-1.2L12 3z"></path>
          </svg>
        </button>
        <button class="header-icon-btn" id="settingsNavBtn" title="设置">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- ===== Body ===== -->
    <div class="app-body">
      <!-- ===== Sidebar (208px) ===== -->
      <nav class="app-sidebar" id="sidebar">

        <!-- WORKSPACE 组 -->
        <div class="sidebar-section">
          <div class="sidebar-section-title">WORKSPACE</div>
          <div class="sidebar-nav">
            <a href="#" class="nav-item" data-module="overview" title="总览">
              <span class="nav-icon">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="3" width="7" height="7"></rect>
                  <rect x="14" y="3" width="7" height="7"></rect>
                  <rect x="14" y="14" width="7" height="7"></rect>
                  <rect x="3" y="14" width="7" height="7"></rect>
                </svg>
              </span>
              <span class="nav-label">总览</span>
            </a>
            <a href="#" class="nav-item active" data-module="search" title="知识">
              <span class="nav-icon">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                  <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                </svg>
              </span>
              <span class="nav-label">知识</span>
            </a>
            <a href="#" class="nav-item" data-module="obsidian-reviews" title="复盘">
              <span class="nav-icon">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="23 4 23 10 17 10"></polyline>
                  <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
                </svg>
              </span>
              <span class="nav-label">复盘</span>
            </a>
            <a href="#" class="nav-item" data-module="prompt" title="提示词">
              <span class="nav-icon">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                </svg>
              </span>
              <span class="nav-label">提示词</span>
            </a>
            <a href="#" class="nav-item" data-module="radar" title="信息雷达">
              <span class="nav-icon">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="10"></circle>
                  <circle cx="12" cy="12" r="6"></circle>
                  <circle cx="12" cy="12" r="2"></circle>
                  <line x1="12" y1="2" x2="12" y2="4"></line>
                  <line x1="12" y1="20" x2="12" y2="22"></line>
                  <line x1="2" y1="12" x2="4" y2="12"></line>
                  <line x1="20" y1="12" x2="22" y2="12"></line>
                </svg>
              </span>
              <span class="nav-label">信息雷达</span>
            </a>
            <a href="#" class="nav-item" data-module="english" title="英语学习">
              <span class="nav-icon">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                  <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                  <line x1="8" y1="7" x2="16" y2="7"></line>
                  <line x1="8" y1="11" x2="14" y2="11"></line>
                </svg>
              </span>
              <span class="nav-label">英语学习</span>
            </a>
          </div>
        </div>

        <!-- SYSTEM 组 -->
        <div class="sidebar-section">
          <div class="sidebar-section-title">SYSTEM</div>
          <div class="sidebar-nav">
            <a href="#" class="nav-item" data-module="website" title="网站">
              <span class="nav-icon">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="10"></circle>
                  <line x1="2" y1="12" x2="22" y2="12"></line>
                  <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                </svg>
              </span>
              <span class="nav-label">网站</span>
            </a>
            <a href="#" class="nav-item" data-module="settings" title="设置">
              <span class="nav-icon">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="3"></circle>
                  <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
              </span>
              <span class="nav-label">设置</span>
            </a>
          </div>
        </div>

        <!-- 底部状态 -->
        <div class="sidebar-footer">
          <div class="index-status" id="indexStatus">
            <span class="status-dot synced"></span>
            <span class="status-text">索引已同步 <strong id="indexCount">0</strong> 篇笔记</span>
          </div>
        </div>
      </nav>

      <!-- ===== Content Area ===== -->
      <main class="app-content" id="contentArea">
        <div class="content-inner" id="contentInner">
          <!-- 模块内容动态加载 -->
        </div>
      </main>
    </div>
  </div>

  <!-- 加载遮罩 -->
  <div class="loading-overlay" id="loadingOverlay" style="display:none;">
    <div class="loading-spinner"></div>
    <p class="loading-text" id="loadingText">加载中...</p>
  </div>

  <!-- Toast通知 -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- 通用弹窗 -->
  <div class="modal-overlay" id="modalOverlay" style="display:none;">
    <div class="modal-box">
      <div class="modal-header">
        <h3 class="modal-title" id="modalTitle">标题</h3>
        <button class="modal-close" id="modalClose">&times;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <!-- 核心脚本 -->
  <script src="/core/api.js"></script>
  <script src="/core/app.js"></script>
  <script src="/core/motion.js"></script>
  <!-- 模块脚本 -->
  <script src="/modules/overview/module.js"></script>
  <script src="/modules/search/module.js"></script>
  <script src="/modules/prompt/module.js"></script>
  <script src="/modules/website/module.js"></script>
  <script src="/modules/obsidian-reviews/module.js"></script>
  <script src="/modules/radar/module.js"></script>
  <script src="/modules/english/module.js"></script>
  <script src="/modules/personal-ai/module.js"></script>
</body>
</html>
